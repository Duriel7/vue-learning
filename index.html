<!DOCTYPE html>
<html lang="en">
<head>
  <title>My first Vue page</title>
</head>
<body>
    <div id="app">
        <p>{{ "Counter: " + count }}</p>
        <p>{{ "Text: " + text }}</p>
        <button v-on:click="operation(count); textShow(text)">Count</button>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
    const app = Vue.createApp({
        data() {
            let count = 0
            let text = ""
            return {
                count, text
            }
        },
        methods: {
            operation(value) {
                this.count++
            },
            textShow(value) {
                this.text = "Hello World + counter = " + this.count
            }
        }
    })
    app.mount('#app')
    </script>
</body>
</html>
