<!DOCTYPE html>
<html lang="en">
<head>
  <title>My first Vue page</title>
</head>
<body>
    <div id="app1">
        <p>{{ "Counter: " + count }}</p>
        <p>{{ "Text: " + text }}</p>
        <button v-on:click="operation(count); textShow(text)">Count</button>
    </div>

    <div id="app2">
        <form v-on:submit.prevent="addItem">
            <p>Add item</p>
            <p>Item name: <input type="text" required v-model="itemName"></p>
            <p>How many: <input type="number" v-model="itemNumber"></p>
            <button type="submit">Add item</button>
        </form>

        <p>Shopping list:</p>
        <ul>
            <li v-for="item in shoppingList">{{item.name}}, {{item.number}}</li>
        </ul>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const app1 = Vue.createApp({
            data() {
                let count = 0
                let text = ""
                return {
                    count, text
                }
            },
            methods: {
                operation(value) {
                    this.count++
                },
                textShow(value) {
                    this.text = "Hello World + counter = " + this.count
                }
            }
        })

        const app2 = Vue.createApp({
            data() {
                return {
                    itemName: null,
                    itemNumber: null,
                    shoppingList: [ ]
                }
            },
            methods: {
                addItem() {
                    let item = {
                    name: this.itemName,
                    number: this.itemNumber
                    }
                    this.shoppingList.push(item);
                    this.itemName = null
                    this.itemNumber = null
                }
                }
        }) 
        
        app1.mount('#app1')
        app2.mount('#app2')
    </script>
</body>
</html>
